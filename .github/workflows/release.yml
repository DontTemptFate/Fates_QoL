name: Release

# Push a tag v<version> (e.g. v0.1.0-beta.1): both jars are built with that version, checksummed and published
# as a GitHub Release (a pre-release when the version has "-alpha"/"-beta"), with the notes for that version
# from CHANGELOG.md. latest.json on the data branch is updated so players get a notice (never a download).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$' || { echo "tag $GITHUB_REF_NAME isn't v<major>.<minor>.<patch>[-alpha|beta|rc.N]"; exit 1; }
          python3 ci/release_notes.py "$v" > /dev/null
          # the tag must match the source, so the jars, the notes and gradle.properties all say the same version
          src=$(grep '^version=' gradle.properties | cut -d= -f2)
          [ "$v" = "$src" ] || { echo "tag $v doesn't match gradle.properties version $src"; exit 1; }

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} -Pversion="${GITHUB_REF_NAME#v}" --stacktrace --no-daemon
          for f in build/libs/*.jar; do
            if unzip -l "$f" | grep -q terraformersmc; then echo "Mod Menu stub classes found in $f"; exit 1; fi
          done
          rm -f build/libs/*-sources.jar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-${{ matrix.mc }}
          path: build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum *.jar > SHA256SUMS
          cat SHA256SUMS
          python3 ../ci/release_notes.py "$v" > ../notes.md
          { echo; echo "Checksums (SHA-256):"; echo '```'; cat SHA256SUMS; echo '```'; } >> ../notes.md
          pre=""
          case "$v" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" *.jar SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "Fates OFA $v" --notes-file ../notes.md $pre

      - name: Update latest.json on the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          pre=false
          case "$v" in *-*) pre=true;; esac
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --quiet --branch data --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" databranch
          else
            mkdir databranch && cd databranch && git init -q -b data && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" && cd ..
          fi
          cd databranch
          python3 - "$v" "$pre" <<'PY'
          import json, sys
          v, pre = sys.argv[1], sys.argv[2] == "true"
          json.dump({"version": v, "prerelease": pre,
                     "url": f"https://github.com/DontTemptFate/Fates_QoL/releases/tag/v{v}"}, open("latest.json", "w"), indent=1)
          PY
          git config user.name "fates-ofa-release"
          git config user.email "release@users.noreply.github.com"
          git add latest.json
          git commit -q -m "latest.json: $v" || exit 0
          for i in 1 2 3; do git push -q origin HEAD:data && break; git pull -q --rebase origin data; sleep 5; done
