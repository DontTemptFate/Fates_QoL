name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Room pack builder tests
        run: python3 ci/rooms/test_rooms.py

      - name: Build and test
        id: build
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace --no-daemon 2>&1 | tee build.log

      # Signatures of the Minecraft / Fabric classes the mod uses, for development (no source access here).
      - name: API reference (javap)
        if: always()
        continue-on-error: true
        run: bash ci/api-dump.sh api

      # 26.3 renders through SDL3 and needs a real (virtual) display with GL drivers on CI.
      - name: Virtual display for the game test
        if: steps.build.outcome == 'success' && matrix.mc != '26.2'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 mesa-vulkan-drivers > /dev/null

      - name: In-game smoke test (real Minecraft client)
        id: gametest
        if: steps.build.outcome == 'success'
        timeout-minutes: 15
        run: |
          set -o pipefail
          if [ "${{ matrix.mc }}" = "26.2" ]; then
            ./gradlew runClientGametest -Pmc=${{ matrix.mc }} --stacktrace --no-daemon 2>&1 | tee gametest.log
          else
            xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGametest -Pmc=${{ matrix.mc }} --stacktrace --no-daemon 2>&1 | tee gametest.log
          fi

      - name: Collect results
        if: always()
        run: |
          out=out/mc${{ matrix.mc }}
          mkdir -p "$out/screenshots"
          cp build.log "$out/" 2>/dev/null || echo "no build log" > "$out/build.log"
          cp gametest.log "$out/" 2>/dev/null || true
          cp -r api "$out/api" 2>/dev/null || true
          cp build/run/clientGameTest/screenshots/*.png "$out/screenshots/" 2>/dev/null || true
          cp build/run/clientGameTest/logs/latest.log "$out/client-latest.log" 2>/dev/null || true
          cp -r build/test-results "$out/test-results" 2>/dev/null || true
          for f in build/libs/*.jar; do
            case "$f" in *-sources.jar) ;; *) [ -f "$f" ] && cp "$f" "$out/" ;; esac
          done
          {
            echo "result=${{ steps.build.outcome }}"
            echo "gametest=${{ steps.gametest.outcome }}"
          } > "$out/RESULT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fatesofa-mc${{ matrix.mc }}
          path: out/mc${{ matrix.mc }}

  # Publishes every version's jar, logs, screenshots and API reference to the `ci-results` branch, so
  # the result can be read with plain git. Only for pushes.
  publish:
    needs: build
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/ci
      - name: Push to ci-results
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/ci
          {
            echo "sha=${GITHUB_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            for d in */; do echo "[${d%/}]"; cat "$d/RESULT" 2>/dev/null || echo "result=missing"; done
          } > RESULT
          git init -q -b ci-results
          git config user.name "fates-ofa-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI result for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
