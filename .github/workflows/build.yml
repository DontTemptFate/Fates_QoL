name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Room pack builder tests
        run: python3 ci/rooms/test_rooms.py

      - name: README lists every command; changelog readable
        run: |
          python3 ci/check_readme.py
          python3 ci/release_notes.py "$(grep '^version=' gradle.properties | cut -d= -f2)" > /dev/null || python3 ci/release_notes.py 0.1.0-beta.1 > /dev/null

      - name: Build and test
        id: build
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace --no-daemon 2>&1 | tee build.log
          # the Mod Menu stand-ins are only for compiling; they must never ship
          for f in build/libs/*.jar; do
            if unzip -l "$f" | grep -q terraformersmc; then echo "Mod Menu stub classes found in $f" | tee -a build.log; exit 1; fi
          done

      # Signatures of the Minecraft / Fabric classes the mod uses, for development (no source access here).
      - name: API reference (javap)
        if: always()
        continue-on-error: true
        run: bash ci/api-dump.sh api

      # 26.3 renders through SDL3 and needs a real (virtual) display with GL drivers on CI.
      - name: Virtual display for the game test
        if: steps.build.outcome == 'success' && matrix.mc != '26.2'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 mesa-vulkan-drivers > /dev/null

      - name: In-game smoke test (real Minecraft client)
        id: gametest
        if: steps.build.outcome == 'success'
        timeout-minutes: 15
        run: |
          set -o pipefail
          if [ "${{ matrix.mc }}" = "26.2" ]; then
            ./gradlew runClientGametest -Pmc=${{ matrix.mc }} --stacktrace --no-daemon 2>&1 | tee gametest.log
          else
            xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGametest -Pmc=${{ matrix.mc }} --stacktrace --no-daemon 2>&1 | tee gametest.log
          fi

      - name: Collect results
        if: always()
        run: |
          out=out/mc${{ matrix.mc }}
          mkdir -p "$out/screenshots"
          cp build.log "$out/" 2>/dev/null || echo "no build log" > "$out/build.log"
          cp gametest.log "$out/" 2>/dev/null || true
          cp -r api "$out/api" 2>/dev/null || true
          cp build/run/clientGameTest/screenshots/*.png "$out/screenshots/" 2>/dev/null || true
          cp build/run/clientGameTest/logs/latest.log "$out/client-latest.log" 2>/dev/null || true
          cp -r build/test-results "$out/test-results" 2>/dev/null || true
          for f in build/libs/*.jar; do
            case "$f" in *-sources.jar) ;; *) [ -f "$f" ] && cp "$f" "$out/" ;; esac
          done
          {
            echo "result=${{ steps.build.outcome }}"
            echo "gametest=${{ steps.gametest.outcome }}"
          } > "$out/RESULT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fatesofa-mc${{ matrix.mc }}
          path: out/mc${{ matrix.mc }}

  # Fates Flipper and OFA in one client (contract-mod §10 item 6): the Flipper is built from its public
  # repo and added to OFA's game test, which then also runs its "together" checks.
  together:
    name: With Fates Flipper, Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DontTemptFate/Fates_Flipper
          ref: main
          path: flipper

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build Fates Flipper
        id: flipper
        run: |
          set -o pipefail
          cd flipper
          chmod +x ./gradlew
          ./gradlew build -x test -Pmc=${{ matrix.mc }} --no-daemon 2>&1 | tee ../flipper-build.log
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "jar=$PWD/$jar" >> "$GITHUB_OUTPUT"
          echo "Fates Flipper $(git rev-parse --short HEAD): $jar"

      - name: Virtual display for the game test
        if: matrix.mc != '26.2'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 mesa-vulkan-drivers > /dev/null

      - name: In-game test with both mods
        id: gametest
        timeout-minutes: 15
        run: |
          set -o pipefail
          chmod +x ./gradlew
          cmd="./gradlew runClientGametest -Pmc=${{ matrix.mc }} -PextraMods=${{ steps.flipper.outputs.jar }} --stacktrace --no-daemon"
          if [ "${{ matrix.mc }}" = "26.2" ]; then $cmd 2>&1 | tee gametest.log; else xvfb-run -a -s "-screen 0 1280x720x24" $cmd 2>&1 | tee gametest.log; fi
          grep -q "\[gametest\] together: OK" build/run/clientGameTest/logs/latest.log || { echo "the together checks didn't run"; exit 1; }

      - name: Collect results
        if: always()
        run: |
          out=out/together-mc${{ matrix.mc }}
          mkdir -p "$out/screenshots"
          cp flipper-build.log gametest.log "$out/" 2>/dev/null || true
          cp build/run/clientGameTest/screenshots/9*.png "$out/screenshots/" 2>/dev/null || true
          cp build/run/clientGameTest/logs/latest.log "$out/client-latest.log" 2>/dev/null || true
          {
            echo "flipper=${{ steps.flipper.outcome }}"
            echo "gametest=${{ steps.gametest.outcome }}"
          } > "$out/RESULT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: together-mc${{ matrix.mc }}
          path: out/together-mc${{ matrix.mc }}

  # Publishes every version's jar, logs, screenshots and API reference to the `ci-results` branch, so
  # the result can be read with plain git. Only for pushes.
  publish:
    needs: [build, together]
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/ci
      - name: Push to ci-results
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/ci
          {
            echo "sha=${GITHUB_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            for d in */; do echo "[${d%/}]"; cat "$d/RESULT" 2>/dev/null || echo "result=missing"; done
          } > RESULT
          git init -q -b ci-results
          git config user.name "fates-ofa-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI result for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
