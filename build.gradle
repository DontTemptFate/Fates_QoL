plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Load the numbers for the chosen Minecraft version (-Pmc=26.3; default from gradle.properties).
def mcTarget = project.findProperty("mc") ?: "26.2"
def versionFile = file("versions/${mcTarget}.properties")
if (!versionFile.exists()) throw new GradleException("No versions/${mcTarget}.properties")
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
versionProps.each { k, v -> project.ext.set(k as String, v as String) }

version = "${project.version}+mc${project.minecraft_version}"
group = project.group

sourceSets {
	main {
		// Version-specific calls (window/input library) live in src/mc<version>/java.
		java.srcDir "src/mc${mcTarget}/java"
		resources.srcDir "src/mc${mcTarget}/resources"
	}
}
// Mod Menu's two API interfaces, only to compile against: left out of the jar (the real ones come with Mod Menu)
sourceSets.main.java.srcDir "stubs/modmenu"
tasks.named("jar") {
	exclude "com/terraformersmc/**"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Fates Common, the library shared with Fates Flipper (look, fonts, text, item reading, shared settings)
	maven { url "https://raw.githubusercontent.com/DontTemptFate/Fates_Common/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// bundled inside OFA's jar; with Fates Flipper installed too, Fabric Loader keeps the newest copy
	implementation "io.github.donttemptfate:fatescommon:${project.fates_common_version}+mc${project.minecraft_version}"
	include "io.github.donttemptfate:fatescommon:${project.fates_common_version}+mc${project.minecraft_version}"

	testImplementation "junit:junit:4.13.2"
	testImplementation "com.google.code.gson:gson:2.15.0"
}

fabricApi {
	// In-game smoke test (src/gametest), run in CI with ./gradlew runClientGametest
	configureTests {
		createSourceSet = true
		modId = "fatesofa-test"
		enableGameTests = false
		eula = true
	}
}

// CI's "together" job: -PextraMods=<jar> adds another mod (Fates Flipper) to the game test client
if (project.hasProperty("extraMods")) {
	loom.runs.configureEach {
		vmArg "-Dfabric.addMods=" + project.property("extraMods")
	}
}

processResources {
	def version = project.version
	def minecraftDep = project.minecraft_dep
	// the Fabric API we build and test with is the oldest we accept
	def fabricApiDep = ">=" + project.fabric_api_version
	def commonDep = ">=" + project.fates_common_version
	inputs.property "version", version
	inputs.property "commonDep", commonDep
	inputs.property "minecraftDep", minecraftDep
	inputs.property "fabricApiDep", fabricApiDep

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_dep": minecraftDep, "fabric_api_dep": fabricApiDep, "common_dep": commonDep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xlint:deprecation"]
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnit()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
